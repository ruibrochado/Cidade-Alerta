name: app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_map: ^8.2.2
  image_picker: ^1.2.1
  latlong2: ^0.9.1
  supabase_flutter: ^2.12.2
  google_mlkit_image_labeling: ^0.14.1
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  url_launcher: ^6.3.0
  path: ^1.9.0
  google_fonts: ^8.0.2
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  sqflite: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  patrol: 4.2.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

patrol:
  app_name: app
  android:
    package_name: com.example.app
  ios:
    bundle_id: com.example.app
  macos:
    bundle_id: com.example.app

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/logo_app.png"
  adaptive_icon_background: "#CDE5CB"
  adaptive_icon_foreground: "images/logo_app.png"

flutter_native_splash:
  color: "#CDE5CB"
  image: "images/logo_app.png"
  android: true
  ios: true
  android_12:
    image: "images/logo_app.png"
    icon_background_color: "#CDE5CB"
    color: "#CDE5CB"

flutter:
  uses-material-design: true
  assets:
    - .env
    - images/logo_login_page.png