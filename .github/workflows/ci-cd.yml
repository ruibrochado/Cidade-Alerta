name: Flutter CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '.idea/**'
      - 'app/images/**'

  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '.idea/**'
      - 'app/images/**'

jobs:


  quality_checks:
    name: Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Create dummy .env for Analyzer
        working-directory: ./app
        run: echo "STADIA_MAPS_API_KEY=test_key_123" > .env

      - name: Quality Evaluation
        working-directory: ./app
        run: flutter analyze


      - name: Run tests
        working-directory: ./app
        run: flutter test







  build_and_deploy:
    name: Build & Deploy
    needs: quality_checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Create dummy .env for Analyzer
        working-directory: ./app
        run: touch .env

      - name: Build Android APK
        working-directory: ./app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cidade-alerta-app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk