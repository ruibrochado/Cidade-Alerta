name: Flutter CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '.idea/**'
      - 'app/images/**'

  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '.idea/**'
      - 'app/images/**'

jobs:


  quality_checks:
    name: Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Create dummy .env
        working-directory: ./app
        run: echo "STADIA_MAPS_API_KEY=test_key_123" > .env

      - name: Check formatting
        working-directory: ./app
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: ./app
        run: flutter analyze

      - name: Run tests
        working-directory: ./app
        run: flutter test



