name: Acceptance Tests (UAT)

on:
  pull_request:
    branches: [ "devs" ]
    paths-ignore:
      - '**/*.md'
      - '.idea/**'
      - 'images/**'
  workflow_dispatch:

jobs:
  uat:
    name: Patrol UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Create real .env file
        working-directory: ./app
        run: |
          echo "STADIA_MAPS_API_KEY=test_key_123" > .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol UAT
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          script: cd app && patrol test --target patrol_test/uat/map_test.dart --reporter json > ../uat-results.json || true

      - name: Generate UAT HTML Report
        if: always()
        run: |
          echo "<html><head><title>UAT Results</title>" > uat-report.html
          echo "<style>body{font-family:sans-serif;padding:20px} .pass{color:green} .fail{color:red} table{border-collapse:collapse;width:100%} td,th{border:1px solid #ddd;padding:8px}</style></head><body>" >> uat-report.html
          echo "<h1>Cidade Alerta — UAT Report</h1>" >> uat-report.html
          echo "<p><b>Run:</b> ${{ github.run_number }} &nbsp; <b>Commit:</b> ${{ github.sha }} &nbsp; <b>Date:</b> $(date)</p>" >> uat-report.html
          if [ -f uat-results.json ]; then
            echo "<h2>Test Results</h2><table><tr><th>Test</th><th>Status</th></tr>" >> uat-report.html
            python3 -c "
          import json, sys
          with open('uat-results.json') as f:
              data = json.load(f)
          for test in data.get('tests', []):
              status = 'PASS' if test.get('result') == 'success' else 'FAIL'
              css = 'pass' if status == 'PASS' else 'fail'
              print(f'<tr><td>{test.get(\"name\", \"unknown\")}</td><td class=\"{css}\">{status}</td></tr>')
          " >> uat-report.html 2>/dev/null || echo "<tr><td colspan=2>Could not parse results</td></tr>" >> uat-report.html
            echo "</table>" >> uat-report.html
          else
            echo "<p class='fail'>No results file found.</p>" >> uat-report.html
          fi
          echo "</body></html>" >> uat-report.html

      - name: Pull screenshots from emulator
        if: always()
        run: |
          adb pull /sdcard/Pictures/patrol_screenshots ./uat-screenshots 2>/dev/null || mkdir -p ./uat-screenshots

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-evidence-${{ github.run_number }}
          path: |
            uat-report.html
            uat-results.json
            uat-screenshots/
          retention-days: 30